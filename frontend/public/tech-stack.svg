<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: bold 24px sans-serif; fill: #333; }
    .tech { font: bold 16px sans-serif; fill: white; text-anchor: middle; }
    .icon { font-size: 32px; fill: white; text-anchor: middle; }
  </style>
  
  <text x="400" y="40" class="title" text-anchor="middle">DiscusSync Tech Stack</text>
  
  <!-- React -->
  <rect x="50" y="70" width="100" height="100" rx="10" ry="10" fill="#61DAFB" />
  <text x="100" y="120" class="icon">⚛️</text>
  <text x="100" y="150" class="tech">React</text>
  
  <!-- TypeScript -->
  <rect x="170" y="70" width="100" height="100" rx="10" ry="10" fill="#3178C6" />
  <text x="220" y="120" class="icon">TS</text>
  <text x="220" y="150" class="tech">TypeScript</text>
  
  <!-- Vite -->
  <rect x="290" y="70" width="100" height="100" rx="10" ry="10" fill="#646CFF" />
  <text x="340" y="120" class="icon">⚡</text>
  <text x="340" y="150" class="tech">Vite</text>
  
  <!-- Tailwind CSS -->
  <rect x="410" y="70" width="100" height="100" rx="10" ry="10" fill="#38B2AC" />
  <text x="460" y="120" class="icon">🌊</text>
  <text x="460" y="150" class="tech">Tailwind</text>
  
  <!-- shadcn/ui -->
  <rect x="530" y="70" width="100" height="100" rx="10" ry="10" fill="#000000" />
  <text x="580" y="120" class="icon">🎨</text>
  <text x="580" y="150" class="tech">shadcn/ui</text>
  
  <!-- FastAPI -->
  <rect x="650" y="70" width="100" height="100" rx="10" ry="10" fill="#009688" />
  <text x="700" y="120" class="icon">🚀</text>
  <text x="700" y="150" class="tech">FastAPI</text>
</svg>
